# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: build

on:
  push:
#    branches:
#      - main

jobs:
  cpp:
    runs-on: ['ubuntu-latest']
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: boost
      run: sudo apt-get update && sudo apt-get install -yq libboost-all-dev

    - name: "build cpp"
      run: |
        cd cpp && echo "build cpp"
        find src test -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) -print0 | xargs -0 clang-format --dry-run --Werror
        cmake -DCMAKE_BUILD_TYPE=Release .
        make
        for i in ./test/Release/*/test_*
        do
           echo $i
           $i
        done
  cs:
    runs-on: ['ubuntu-latest']
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: "build cs"
      run: |
        cd cs/ipaddress && echo "build cs"
        dotnet restore
        dotnet format ipaddress.csproj --verify-no-changes
        dotnet build
        dotnet test
        dotnet build -c Release

  dart:
    runs-on: ['ubuntu-latest']
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - uses: dart-lang/setup-dart@v1

    - name: "build dart"
      run: |
        cd dart/ipaddress && echo "build dart"
        dart pub get
        dart format --output=none --set-exit-if-changed .
        dart test

  go:
    runs-on: ['ubuntu-latest']
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: "build go"
      run: |
        cd go/ipaddress && echo "build go"
        go version
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "gofmt found unformatted files:"
          echo "$unformatted"
          exit 1
        fi
        go test -v

  java:
    runs-on: ['ubuntu-latest']
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: "build java"
      run: |
        cd java && echo "build java"
        mvn test -B -Dmaven.javadoc.skip=true

  js:
    runs-on: ['ubuntu-latest']
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: "build js"
      run: |
        cd js && echo "build js"
        npm install
        npx prettier . --check
        npm run build
        npm run test

    - uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: "verify js on deno"
      working-directory: js
      run: |
        deno check --unstable-sloppy-imports src/index.ts test/*.ts
        deno run -A npm:vitest run

    - name: publish
      # npm Trusted Publishing (OIDC) - no NPM_TOKEN secret needed.
      # Requires the npm package to have this repo+workflow registered
      # as a "Trusted Publisher" on npmjs.com beforehand.
      if: startsWith(github.ref, 'refs/tags/js@v')
      working-directory: js
      run: |
        npm install -g npm@latest
        npm --version
        echo $GITHUB_REF
        npm version $(echo $GITHUB_REF | sed -e 's|^refs/tags/js@v||')
        grep version package.json
        npm publish --no-git-checks --access public --provenance

    - name: dry-publish
      if: ${{ ! startsWith(github.ref, 'refs/tags/js@v') }}
      working-directory: js
      run: |
        npm version 0.0.0-snap
        grep version package.json
        npm publish --no-git-checks --access public --dry-run

  jsr:
    needs: js
    runs-on: ['ubuntu-latest']
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: publish
      # JSR OIDC publishing - no token needed. Requires @mabels/ipaddress
      # on jsr.io to have "Publishing from GitHub Actions" linked to this
      # repo+workflow beforehand.
      if: startsWith(github.ref, 'refs/tags/js@v')
      working-directory: js
      run: |
        version=$(echo $GITHUB_REF | sed -e 's|^refs/tags/js@v||')
        echo "publishing jsr version $version"
        sed -i "s/\"version\": \".*\"/\"version\": \"$version\"/" jsr.json
        cat jsr.json
        npx -y jsr publish --allow-slow-types

    - name: dry-publish
      if: ${{ ! startsWith(github.ref, 'refs/tags/js@v') }}
      working-directory: js
      run: |
        npx -y jsr publish --allow-slow-types --dry-run

  kotlin:
    runs-on: ['ubuntu-latest']
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - uses: fwilhe2/setup-kotlin@main

    - name: "build kotlin"
      run: |
        cd kotlin && echo "build kotlin"
        ./gradlew ktlintCheck
        ./gradlew build
        ./gradlew test

  python:
    runs-on: ['ubuntu-latest']
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: "build python"
      run: |
        cd python && echo "build python"
        python -m pip install --upgrade pip build
        pip install -e ".[dev]"
        black --check --diff src tests
        pytest -q

    - name: set version from tag
      if: startsWith(github.ref, 'refs/tags/python@v')
      working-directory: python
      run: |
        version=$(echo $GITHUB_REF | sed -e 's|^refs/tags/python@v||')
        echo "publishing version $version"
        sed -i "s/^version = .*/version = \"$version\"/" pyproject.toml
        grep '^version' pyproject.toml

    - name: build dist
      working-directory: python
      run: python -m build

    - name: publish
      # PyPI Trusted Publishing (OIDC) - no token needed. Requires the
      # ip_address project on pypi.org to have this repo+workflow+job
      # registered as a "trusted publisher" beforehand.
      if: startsWith(github.ref, 'refs/tags/python@v')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: python/dist

    - name: dry-publish check
      if: ${{ ! startsWith(github.ref, 'refs/tags/python@v') }}
      working-directory: python
      run: |
        python -m pip install --upgrade twine
        twine check dist/*

  ruby:
    runs-on: ['ubuntu-latest']
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.2"

    - name: "build ruby"
      run: |
        cd ruby && echo "build ruby"
        gem install jeweler
        gem install test-unit
        gem install standard
        standardrb --no-fix lib test
        rake test

  rust:
    runs-on: ['ubuntu-latest']
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: "build rust"
      run: |
        cd rust && echo "build rust"
        cargo fmt --check
        cargo test --release 

  swift:
    runs-on: ['ubuntu-latest']
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: "build swift"
      run: |
        cd swift && echo "build swift"
        # swift-format's "lint" rules also enforce lowerCamelCase naming,
        # which conflicts with this project's intentionally identical
        # (non-camelCase) method names across every language port. Only
        # check that format(-i) is a no-op, i.e. whitespace/style only.
        swift format format -i -r Sources Tests Package.swift
        git diff --exit-code -- Sources Tests Package.swift
        swift build
        swift test
