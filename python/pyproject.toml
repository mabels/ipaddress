[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mabels-ipaddress"
version = "0.0.0-dev"
description = "ipaddress handles ipv4 and ipv6"
license = { text = "MIT" }
authors = [{ name = "Meno Abels", email = "meno.abels@adviser.com" }]
requires-python = ">=3.9"
keywords = ["ip", "ipv4", "ipv6"]

[project.urls]
Homepage = "https://github.com/mabels/ipaddress"
Repository = "https://github.com/mabels/ipaddress.git"

[project.optional-dependencies]
dev = ["pytest>=7.0", "black>=24.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
